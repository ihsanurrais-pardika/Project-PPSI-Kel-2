n_wd1 : meninjau_wd1\\n    pengguna |o--o{ pertemuan_kuliah : memohon_pengganti\\n    pengguna ||--o{ perubahan_jadwal : mengubah\\n    pengguna |o--o{ deteksi_bentrok : menindaklanjuti\\n    dosen |o--o{ mahasiswa : membimbing_pa\\n    dosen ||--o{ pengampu_kelas : mengampu\\n    dosen ||--o{ preferensi_dosen : memilih_preferensi\\n    dosen |o--o{ krs_mahasiswa : menyetujui_batal\\n    rombongan_belajar |o--o{ mahasiswa : beranggota\\n    rombongan_belajar ||--o{ kelas_rombel : diikuti_kelas\\n    mahasiswa ||--o{ krs_mahasiswa : mengambil_krs\\n    semester_akademik ||--o{ usulan_perkuliahan : periode_usulan\\n    semester_akademik ||--o{ preferensi_dosen : periode_pref\\n    semester_akademik ||--o{ jadwal_versi : periode_versi\\n    semester_akademik ||--o{ proses_solver : periode_solver\\n    mata_kuliah ||--o{ usulan_perkuliahan : ditawarkan_pada\\n    usulan_perkuliahan ||--|{ kelas : dipecah_menjadi\\n    kelas ||--|{ kelas_rombel : diikuti_rombel\\n    kelas ||--|{ pengampu_kelas : diampu_oleh\\n    kelas ||--o{ krs_mahasiswa : didaftarkan\\n    kelas ||--o{ jadwal_kuliah : dijadwalkan\\n    slot_waktu |o--o{ preferensi_dosen : slot_preferensi\\n    slot_waktu |o--o{ jadwal_kuliah : slot_mulai\\n    ruang |o--o{ jadwal_kuliah : dipakai_reguler\\n    ruang ||--o{ pertemuan_kuliah : ditempati_aktual\\n    ruang |o--o{ perubahan_jadwal : ruang_lama_baru\\n    konfigurasi_solver |o--o{ proses_solver : dipakai_solver\\n    jadwal_versi |o--o{ proses_solver : versi_awal_hasil\\n    jadwal_versi ||--o{ persetujuan_wd1 : riwayat_review\\n    jadwal_versi ||--o{ jadwal_kuliah : memuat\\n    jadwal_kuliah ||--o{ pertemuan_kuliah : realisasi_sesi\\n    jadwal_kuliah ||--o{ perubahan_jadwal : diubah\\n    jadwal_kuliah |o--o{ deteksi_bentrok : terlibat_bentrok\\n\\n    program_studi {\\n        smallint id_prodi PK\\n        varchar kode_prodi UK \\&amp;quot;SI, IF, TK\\&amp;quot;\\n        varchar nama_prodi\\n        varchar nama_departemen\\n        timestamptz created_at\\n        timestamptz updated_at\\n    }\\n\\n    pengguna {\\n        bigint id_pengguna PK\\n        smallint id_prodi FK \\&amp;quot;nullable\\&amp;quot;\\n        varchar username UK\\n        varchar password_hash\\n        varchar nama_lengkap\\n        varchar email UK\\n        varchar peran \\&amp;quot;RBAC role\\&amp;quot;\\n        boolean status_aktif\\n        timestamptz last_login_at\\n        timestamptz created_at\\n        timestamptz updated_at\\n    }\\n\\n    sesi_pengguna {\\n        bigint id_sesi PK\\n        bigint id_pengguna FK\\n        varchar refresh_token_hash UK\\n        text user_agent\\n        inet ip_address\\n        timestamptz waktu_login\\n        timestamptz kedaluwarsa_pada\\n        timestamptz waktu_logout\\n        boolean is_revoked\\n    }\\n\\n    log_aktivitas {\\n        bigint id_log PK\\n        bigint id_pengguna FK \\&amp;quot;nullable\\&amp;quot;\\n        varchar kategori\\n        varchar aksi\\n        varchar nama_tabel\\n        varchar id_entitas\\n        text deskripsi\\n        jsonb data_lama\\n        jsonb data_baru\\n        varchar status_log\\n        inet ip_address\\n        timestamptz waktu\\n    }\\n\\n    semester_akademik {\\n        smallint id_semester PK\\n        varchar tahun_ajaran UK\\n        varchar jenis_semester UK\\n        date tgl_mulai\\n        date tgl_selesai\\n        smallint kuota_minimum_kelas\\n        boolean status_aktif \\&amp;quot;max 1 aktif\\&amp;quot;\\n        timestamptz created_at\\n        timestamptz updated_at\\n    }\\n\\n    dosen {\\n        int id_dosen PK\\n        bigint id_pengguna FK \\&amp;quot;nullable 1:1\\&amp;quot;\\n        smallint id_prodi FK \\&amp;quot;nullable eksternal\\&amp;quot;\\n        varchar kode_dosen UK \\&amp;quot;dari CSV\\&amp;quot;\\n        varchar nidn UK \\&amp;quot;nullable\\&amp;quot;\\n        varchar nama_dosen\\n        varchar jabatan_struktural\\n        varchar bidang_keahlian\\n        smallint maks_sks_harian\\n        smallint maks_sks_semester\\n        varchar tipe_dosen\\n        boolean status_aktif\\n    }\\n\\n    rombongan_belajar {\\n        int id_rombel PK\\n        smallint id_prodi FK\\n        smallint semester_paket\\n        varchar kode_rombel UK \\&amp;quot;TK-S1-A\\&amp;quot;\\n        varchar nama_rombel\\n        varchar jenis_rombel\\n    }\\n\\n    mahasiswa {\\n        bigint id_mahasiswa PK\\n        bigint id_pengguna FK \\&amp;quot;unik 1:1\\&amp;quot;\\n        smallint id_prodi FK\\n        int id_rombel FK \\&amp;quot;nullable\\&amp;quot;\\n        int id_dosen_pa FK \\&amp;quot;Dosen PA\\&amp;quot;\\n        varchar nim UK\\n        smallint tahun_masuk\\n        boolean status_aktif\\n    }\\n\\n    mata_kuliah {\\n        int id_mk PK\\n        smallint id_prodi FK \\&amp;quot;nullable MKWU\\&amp;quot;\\n        varchar kode_mk UK\\n        varchar nama_mk\\n        smallint sks\\n        smallint sks_teori\\n        smallint sks_praktikum\\n        smallint semester_paket\\n        varchar kurikulum\\n        varchar jenis_mk\\n        boolean lintas_prodi\\n    }\\n\\n    ruang {\\n        int id_ruang PK\\n        smallint id_prodi_pengelola FK \\&amp;quot;nullable bersama\\&amp;quot;\\n        varchar kode_ruang UK\\n        varchar nama_ruang\\n        varchar gedung\\n        varchar sayap\\n        smallint lantai\\n        decimal luas_m2\\n        smallint kapasitas\\n        varchar jenis_ruang\\n        varchar kategori_solver \\&amp;quot;Teori atau Lab\\&amp;quot;\\n        varchar status_operasional\\n        boolean bisa_dipakai_bersama\\n        boolean aksesibel\\n        jsonb fasilitas\\n        decimal latitude\\n        decimal longitude\\n        text petunjuk_rute\\n        varchar denah_url\\n    }\\n\\n    slot_waktu {\\n        smallint id_slot PK\\n        varchar kode_slot UK\\n        smallint indeks_global UK \\&amp;quot;0..29\\&amp;quot;\\n        varchar hari UK\\n        smallint indeks_harian UK \\&amp;quot;0..5\\&amp;quot;\\n        smallint sesi_ke \\&amp;quot;1..6\\&amp;quot;\\n        time jam_mulai_standar\\n        time jam_selesai_standar\\n        varchar label_waktu\\n    }\\n\\n    usulan_perkuliahan {\\n        int id_usulan PK\\n        smallint id_semester FK\\n        int id_mk FK\\n        smallint id_prodi_pengusul FK\\n        bigint id_pengaju FK\\n        smallint jumlah_kelas_rencana\\n        smallint estimasi_total_mhs\\n        text_array hari_prioritas \\&amp;quot;array hari\\&amp;quot;\\n        varchar sesi_pilihan\\n        boolean hindari_jumat_siang\\n        boolean maks_satu_sesi_per_hari\\n        text catatan_khusus\\n        varchar status_usulan\\n        text catatan_revisi_admin\\n    }\\n\\n    kelas {\\n        int id_kelas PK\\n        int id_usulan FK\\n        varchar kode_referensi_kelas \\&amp;quot;SCE61101-A\\&amp;quot;\\n        varchar kode_kelas UK \\&amp;quot;A, B, Shift 1\\&amp;quot;\\n        smallint sks_efektif \\&amp;quot;1..4 SKS\\&amp;quot;\\n        varchar tipe_ruang_dibutuhkan \\&amp;quot;Teori atau Lab\\&amp;quot;\\n        smallint kapasitas_rencana\\n        smallint estimasi_mahasiswa\\n        smallint jumlah_peserta\\n        boolean estimasi_otomatis\\n        boolean butuh_ruang \\&amp;quot;FALSE=KKN/TA\\&amp;quot;\\n        boolean butuh_aksesibilitas\\n        boolean is_transisi\\n        varchar status_kelas\\n    }\\n\\n    kelas_rombel {\\n        int id_kelas PK, FK\\n        int id_rombel PK, FK\\n    }\\n\\n    pengampu_kelas {\\n        int id_kelas PK, FK\\n        int id_dosen PK, FK\\n        varchar peran_pengampu \\&amp;quot;Utama/Tandem\\&amp;quot;\\n        smallint urutan_tandem\\n    }\\n\\n    krs_mahasiswa {\\n        bigint id_krs PK\\n        bigint id_mahasiswa FK\\n        int id_kelas FK\\n        varchar status_krs\\n        int id_dosen_pa_penyetuju FK \\&amp;quot;nullable\\&amp;quot;\\n        timestamptz waktu_persetujuan_pa\\n        text alasan_batal\\n    }\\n eh FK\\n        bigint diterbitkan_oleh FK \\&amp;quot;nullable\\&amp;quot;\\n        timestamptz tgl_publikasi\\n        boolean is_aktif_portal \\&amp;quot;max 1 per semester\\&amp;quot;\\n    }\\n\\n    persetujuan_wd1 {\\n        bigint id_persetujuan PK\\n        int id_versi FK\\n        bigint id_peninjau FK \\&amp;quot;aktor WD1\\&amp;quot;\\n        varchar keputusan \\&amp;quot;Disetujui/Revisi\\&amp;quot;\\n        text catatan_revisi\\n        varchar nomor_sk\\n        varchar signature_bsre\\n        timestamptz waktu_keputusan\\n    }\\n\\n    jadwal_kuliah {\\n        bigint id_jadwal PK\\n        int id_versi FK\\n        int id_kelas FK\\n        int id_ruang FK \\&amp;quot;nullable\\&amp;quot;\\n        smallint id_slot_mulai FK \\&amp;quot;nullable\\&amp;quot;\\n        smallint durasi_slot\\n        varchar hari\\n        time jam_mulai\\n        time jam_selesai\\n        int4range rentang_waktu_mingguan \\&amp;quot;GiST exclude\\&amp;quot;\\n        varchar status_review_wd1\\n        text catatan_review_wd1\\n    }\\n\\n    pertemuan_kuliah {\\n        bigint id_pertemuan PK\\n        bigint id_jadwal FK\\n        int id_ruang_aktual FK\\n        bigint id_pemohon_pengganti FK \\&amp;quot;nullable\\&amp;quot;\\n        smallint pertemuan_ke UK \\&amp;quot;1..16\\&amp;quot;\\n        date tanggal_pertemuan\\n        time jam_mulai_aktual\\n        time jam_selesai_aktual\\n        int4range rentang_menit \\&amp;quot;GiST exclude\\&amp;quot;\\n        varchar status_pertemuan\\n        varchar status_pengajuan_ruang\\n        text alasan_penggantian\\n        varchar qr_presensi_token\\n        text keterangan\\n    }\\n\\n    perubahan_jadwal {\\n        bigint id_perubahan PK\\n        bigint id_jadwal FK\\n        bigint id_pengguna FK\\n        varchar jenis_perubahan\\n        varchar hari_lama\\n        time jam_mulai_lama\\n        time jam_selesai_lama\\n        smallint sks_lama\\n        int id_ruang_lama FK \\&amp;quot;nullable\\&amp
